<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Join data flow</title>
  <desc id="desc">Browser pages use JavaScript modules, local and session storage, and Firebase Realtime Database through REST fetch calls.</desc>
  <style>
    .bg{fill:#f6f7f8}.box{fill:#fff;stroke:#d1d5db;stroke-width:2}.title{font:700 24px Arial, sans-serif;fill:#2a3647}.text{font:700 17px Arial, sans-serif;fill:#2a3647}.sub{font:400 13px Arial, sans-serif;fill:#6b7280}.arrow{stroke:#29abe2;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#29abe2}.dark{fill:#2a3647}.muted{fill:#eef2f7}.db{fill:#fff;stroke:#29abe2;stroke-width:3}
  </style>
  <rect class="bg" width="960" height="360" rx="24"/>
  <text class="title" x="48" y="54">Application data flow</text>
  <g transform="translate(48 112)">
    <rect class="box" width="190" height="132" rx="18"/>
    <rect class="muted" x="36" y="28" width="118" height="54" rx="8"/>
    <path d="M50 48h90M50 64h58" stroke="#2a3647" stroke-width="4" stroke-linecap="round"/>
    <text class="text" x="95" y="110" text-anchor="middle">HTML pages</text>
  </g>
  <path class="arrow" d="M255 178h78"/><path class="accent" d="M334 178l-12-8v16l12-8z"/>
  <g transform="translate(352 112)">
    <rect class="box" width="210" height="132" rx="18"/>
    <circle class="accent" cx="66" cy="50" r="22"/>
    <text x="66" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="white">JS</text>
    <path d="M112 40h60M112 58h42" stroke="#2a3647" stroke-width="4" stroke-linecap="round"/>
    <text class="text" x="105" y="110" text-anchor="middle">JavaScript logic</text>
  </g>
  <path class="arrow" d="M579 178h78"/><path class="accent" d="M658 178l-12-8v16l12-8z"/>
  <g transform="translate(676 96)">
    <ellipse class="db" cx="100" cy="36" rx="88" ry="28"/>
    <path class="db" d="M12 36v112c0 15.5 39.4 28 88 28s88-12.5 88-28V36"/>
    <ellipse class="db" cx="100" cy="148" rx="88" ry="28"/>
    <text class="text" x="100" y="90" text-anchor="middle">Firebase</text>
    <text class="sub" x="100" y="112" text-anchor="middle">Realtime Database</text>
  </g>
  <path class="arrow" d="M458 257v44h-260v-34"/><path class="accent" d="M198 266l-8 12h16l-8-12z"/>
  <g transform="translate(330 286)">
    <rect class="box" width="260" height="48" rx="14"/>
    <text class="text" x="130" y="31" text-anchor="middle">sessionStorage / localStorage</text>
  </g>
  <text class="sub" x="296" y="162" text-anchor="middle">events</text>
  <text class="sub" x="620" y="162" text-anchor="middle">REST fetch</text>
  <text class="sub" x="328" y="282" text-anchor="middle">session state</text>
</svg>
