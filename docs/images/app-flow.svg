<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Join app flow</title>
  <desc id="desc">Overview of the user flow from login to summary, task creation, board management and contacts.</desc>
  <style>
    .bg{fill:#f6f7f8}.card{fill:#fff;stroke:#d1d5db;stroke-width:2}.title{font:700 24px Arial, sans-serif;fill:#2a3647}.text{font:600 16px Arial, sans-serif;fill:#2a3647}.sub{font:400 13px Arial, sans-serif;fill:#6b7280}.arrow{stroke:#29abe2;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#29abe2}.dark{fill:#2a3647}.muted{fill:#eef2f7}
  </style>
  <rect class="bg" width="960" height="360" rx="24"/>
  <text class="title" x="48" y="54">Join user journey</text>
  <g transform="translate(48 95)">
    <rect class="card" width="160" height="120" rx="18"/>
    <circle class="accent" cx="80" cy="42" r="20"/>
    <path d="M70 43l7 7 15-17" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="text" x="80" y="82" text-anchor="middle">Log in</text>
    <text class="sub" x="80" y="104" text-anchor="middle">user or guest</text>
  </g>
  <path class="arrow" d="M225 155h70"/><path class="accent" d="M296 155l-12-8v16l12-8z"/>
  <g transform="translate(312 95)">
    <rect class="card" width="160" height="120" rx="18"/>
    <rect class="muted" x="48" y="24" width="64" height="42" rx="8"/>
    <path d="M58 52h44M58 39h30" stroke="#2a3647" stroke-width="4" stroke-linecap="round"/>
    <text class="text" x="80" y="82" text-anchor="middle">Summary</text>
    <text class="sub" x="80" y="104" text-anchor="middle">task metrics</text>
  </g>
  <path class="arrow" d="M489 155h70"/><path class="accent" d="M560 155l-12-8v16l12-8z"/>
  <g transform="translate(576 95)">
    <rect class="card" width="160" height="120" rx="18"/>
    <rect class="muted" x="42" y="24" width="76" height="52" rx="8"/>
    <path d="M58 42h44M58 58h30" stroke="#2a3647" stroke-width="4" stroke-linecap="round"/>
    <circle class="accent" cx="116" cy="72" r="14"/>
    <path d="M116 65v14M109 72h14" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text class="text" x="80" y="96" text-anchor="middle">Add task</text>
  </g>
  <path class="arrow" d="M736 155h70"/><path class="accent" d="M807 155l-12-8v16l12-8z"/>
  <g transform="translate(824 95)">
    <rect class="card" width="88" height="120" rx="18"/>
    <rect class="accent" x="20" y="26" width="48" height="12" rx="4"/>
    <rect class="muted" x="20" y="48" width="48" height="12" rx="4"/>
    <rect class="muted" x="20" y="70" width="48" height="12" rx="4"/>
    <text class="text" x="44" y="106" text-anchor="middle">Board</text>
  </g>
  <path class="arrow" d="M656 220c-70 80-245 80-315 0"/><path class="accent" d="M335 218l15 3-10 12-5-15z"/>
  <g transform="translate(352 252)">
    <rect class="card" width="256" height="64" rx="18"/>
    <circle class="dark" cx="44" cy="32" r="16"/>
    <circle class="accent" cx="80" cy="32" r="16"/>
    <circle fill="#ff7a00" cx="116" cy="32" r="16"/>
    <text class="text" x="176" y="38" text-anchor="middle">Contacts</text>
  </g>
</svg>
