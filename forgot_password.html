<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Forgot Password</title>
    <link rel="icon" href="assets/img/favicon.png" />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/login.css" />
    <link rel="stylesheet" href="style/auth_status.css" />
    <link rel="stylesheet" href="style/password_reset.css?v=20261031-reset1" />
  </head>
  <body class="password-reset-page">
    <a class="password-reset-logo" href="index.html" aria-label="JOIN home">
      <picture>
        <source media="(max-width: 720px)" srcset="assets/img/password-reset/logo-mobile.svg" />
        <img src="assets/img/password-reset/logo-desktop.svg" alt="JOIN" />
      </picture>
    </a>
    <main class="password-reset-main">
      <section class="password-reset-card" aria-labelledby="password_reset_heading">
        <a class="password-reset-back" href="login.html" aria-label="Back to log in">
          <picture>
            <source media="(max-width: 720px)" srcset="assets/icons/password-reset/arrow-mobile.svg" />
            <img src="assets/icons/password-reset/arrow-desktop.svg" alt="" />
          </picture>
        </a>
        <div class="password-reset-heading">
          <h1 id="password_reset_heading">I forgot my password</h1>
          <picture class="password-reset-accent" aria-hidden="true">
            <source media="(max-width: 720px)" srcset="assets/icons/password-reset/accent-mobile.svg" />
            <img src="assets/icons/password-reset/accent-desktop.svg" alt="" />
          </picture>
        </div>
        <p class="password-reset-help" id="password_reset_help">
          Don't worry! We will send you an email with the instructions to reset your password.
        </p>
        <form class="password-reset-form" id="password_reset_form"
          onsubmit="handlePasswordReset(event); return false;" novalidate>
          <label class="input-base-container password-reset-email" for="password_reset_email">
            <span class="password-reset-label">Email address</span>
            <input class="input-base" id="password_reset_email" type="email" name="email"
              autocomplete="email" placeholder="Email" required
              aria-describedby="password_reset_help password_reset_status"
              oninput="clearPasswordResetFeedback()" />
            <span class="input-base-icon" aria-hidden="true">
              <img src="assets/icons/password-reset/mail.svg" alt="" />
            </span>
          </label>
          <button class="button-log-in password-reset-submit" id="password_reset_button" type="submit">
            Send me the email
          </button>
          <p class="auth-status d-none" id="password_reset_status" role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
      </section>
    </main>
    <script src="script/firebase_auth.js?v=20261025-session3"></script>
    <script src="script/password_reset.js?v=20261031-reset1"></script>
  </body>
</html>
