<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Welcome</title>
    <link rel="icon" href="./assets/img/favicon.png" />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/welcome.css" />
  </head>
  <body class="welcome-page">
    <main class="welcome-main" aria-labelledby="welcome-heading">
      <section class="welcome-dialog">
        <div class="welcome-content">
          <div class="welcome-heading-group">
            <h1 id="welcome-heading">Welcome</h1>
            <div class="welcome-accent" aria-hidden="true"></div>
          </div>

          <p class="welcome-intro">
            Pick the option that suits your role: create a request as a stakeholder or log in if you’re part of the team.
          </p>

          <div class="welcome-options" aria-label="Choose your Join role">
            <div class="welcome-option">
              <div class="welcome-role-label">
                <img src="assets/img/add-task.png" alt="" aria-hidden="true" />
                <span>Are you a stakeholder?</span>
              </div>
              <a class="welcome-primary-button" href="stakeholder.html">Create request</a>
            </div>

            <div class="welcome-option">
              <div class="welcome-role-label">
                <img src="assets/img/contacts.png" alt="" aria-hidden="true" />
                <span>Are you a team member?</span>
              </div>
              <a class="welcome-secondary-button" href="login.html">Member log in</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="welcome-footer">
      <a href="privacy_policy.html">Privacy Policy</a>
      <a href="legal_notice.html">Legal notice</a>
    </footer>
  </body>
</html>
